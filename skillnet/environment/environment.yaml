engines: []
apt:
  - xz-utils
  - curl
  - ca-certificates
pip:
  - Pillow==11.0.0
  - numpy==2.1.3
run:
  - curl -fsSL https://nodejs.org/dist/v24.11.1/node-v24.11.1-linux-x64.tar.xz
    -o /tmp/node24.tar.xz && mkdir -p /opt/node24 && tar -xJf /tmp/node24.tar.xz
    -C /opt/node24 --strip-components=1 && rm /tmp/node24.tar.xz
  - mkdir -p /opt/romdev && cd /opt/romdev && PATH=/opt/node24/bin:$PATH npm
    init -y >/dev/null && PATH=/opt/node24/bin:$PATH npm install --no-audit
    --no-fund romdevtools@0.150.2
  - cd /opt/romdev && PATH=/opt/node24/bin:$PATH npm install --no-audit
    --no-fund romdev-core-fceumm@0.13.2 romdev-core-gambatte@0.12.2
    romdev-core-gpgx@0.15.2 romdev-toolchain-cc65@0.1.5
    romdev-toolchain-sdcc@0.2.3 romdev-toolchain-rgbds@0.1.3
    romdev-toolchain-m68k-gcc@0.4.2
  - PATH=/opt/node24/bin:$PATH npm cache clean --force
smoke:
  - /opt/node24/bin/node --version | grep -q '^v24'
  - cd /opt/romdev && PATH=/opt/node24/bin:$PATH timeout 60 npx --no-install
    romdevtools-cli --help
  - for p in romdevtools romdev-core-fceumm romdev-core-gambatte
    romdev-core-gpgx romdev-toolchain-cc65 romdev-toolchain-sdcc
    romdev-toolchain-rgbds romdev-toolchain-m68k-gcc; do test -f
    /opt/romdev/node_modules/$p/package.json || exit 1; done
  - python -c "import PIL, numpy; print(PIL.__version__, numpy.__version__)"
  - sh -c 'PORT=7399 /opt/node24/bin/node /opt/romdev/node_modules/romdevtools/src/mcp/server.js & P=$!; sleep 8; curl -fsS http://127.0.0.1:7399/openapi.json | grep -q build; R=$?; kill $P 2>/dev/null; exit $R'
