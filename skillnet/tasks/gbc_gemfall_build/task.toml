schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/retro-game-forge-gbc_gemfall_build"
description = "Retro Game Forge — Build a real ROM: Build me a falling-jewel puzzle game for the Game Boy Color. Call it GEMFALL — the cartridge header has to carry that name, because it's what my flash cart's me"
keywords = ["skillnet", "retro-game-forge", "build-a-real-rom"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "retro-game-forge"
version = 2
task = "gbc_gemfall_build"
ability = "Build a real ROM"
core = true
source = "builder"
judge = "programmatic"
prompt = "Build me a falling-jewel puzzle game for the Game Boy Color. Call it GEMFALL — the cartridge header has to carry that name, because it's what my flash cart's menu shows, and it must run in colour on a Game Boy Color.\n\nSend me the `.gbc` ROM file and a screenshot of it running in an emulator."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
